<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo Showcase</title>
    <style>
        :root {
            --sidebar-width: 300px;
            --accent-blue: #007bff;
            --accent-green: #28a745;
            --accent-red: #dc3545;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: white;
        }

        #main-view {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 1;
        }

        .slide {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            transition: opacity 0.5s ease-in-out;
            opacity: 0;
            pointer-events: none;
        }
        .slide.visible { opacity: 1; }

        #folder-label {
            position: absolute; bottom: 20px; right: 20px;
            z-index: 10;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.3);
            padding: 5px 12px;
            border-radius: 4px;
            pointer-events: none;
            transition: opacity 0.5s ease;
            opacity: 0;
        }
        #folder-label.visible { opacity: 1; }

        #sidebar {
            position: absolute; top: 0; left: calc(-1 * var(--sidebar-width));
            width: var(--sidebar-width); height: 100%;
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
            box-shadow: 2px 0 15px rgba(0,0,0,0.5);
        }
        #sidebar.open { transform: translateX(var(--sidebar-width)); }

        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header h3 { margin: 0; font-size: 1.2rem; }

        .sidebar-content { flex: 1; overflow-y: auto; padding: 15px; }

        .showcase-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px; margin-top: 10px;
        }
        .thumbnail {
            width: 100%; aspect-ratio: 1; object-fit: cover;
            border-radius: 6px; cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            border: 2px solid transparent;
            background-color: #333;
        }
        .thumbnail:hover { transform: scale(1.05); }
        .thumbnail.active { border-color: var(--accent-blue); box-shadow: 0 0 10px var(--accent-blue); }

        .control-panel {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: center;
        }
        .btn-autoplay {
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            color: white;
            transition: all 0.2s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            width: 100%;
        }
        .btn-play { background-color: var(--accent-green); }
        .btn-stop { background-color: var(--accent-red); }

        #menu-toggle {
            position: absolute; top: 20px; left: 20px;
            z-index: 110; width: 44px; height: 44px;
            background: rgba(0,0,0,0.5); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        #menu-toggle svg { width: 24px; height: 24px; fill: white; }

        @media (max-width: 768px) {
            :root { --sidebar-width: 85%; }
        }
    </style>
</head>
<body onclick="closeSidebarOnImageClick(event)">

<div id="menu-toggle" onclick="toggleSidebar(event)">
    <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
</div>

<div id="sidebar">
    <div class="sidebar-header">
        <h3>Showcase</h3>
    </div>
    <div class="sidebar-content">
        <div class="showcase-grid" id="showcase"></div>
        <div class="control-panel">
            <button id="btn-autoplay" class="btn-autoplay" onclick="toggleAutoplay()">読み込み中...</button>
        </div>
    </div>
</div>

<div id="main-view">
    <img id="slide-a" class="slide">
    <img id="slide-b" class="slide">
    <div id="folder-label"></div>
</div>

<script>
    let currentIndex = -1;
    let activeIdx = 0;
    const slides = [document.getElementById('slide-a'), document.getElementById('slide-b')];
    const showcase = document.getElementById('showcase');
    const sidebar = document.getElementById('sidebar');
    const folderLabel = document.getElementById('folder-label');
    const btnAutoplay = document.getElementById('btn-autoplay');

    function toggleSidebar(event) {
        if (event) event.stopPropagation();
        sidebar.classList.toggle('open');
    }

    function closeSidebarOnImageClick(event) {
        if (event.target.classList.contains('slide')) {
            sidebar.classList.remove('open');
        }
    }

    async function updateStatus() {
        try {
            const response = await fetch('/status');
            const data = await response.json();

            if (data.index !== currentIndex) {
                currentIndex = data.index;
                const res = await fetch('/current_image_url');
                const imgData = await res.json();

                const nextIdx = 1 - activeIdx;
                slides[activeIdx].classList.remove('visible');
                slides[nextIdx].src = imgData.url;
                slides[nextIdx].classList.add('visible');
                activeIdx = nextIdx;

                if (imgData.folder) {
                    folderLabel.innerText = imgData.folder;
                    folderLabel.classList.add('visible');
                } else {
                    folderLabel.classList.remove('visible');
                }
            }

            renderShowcase(data.image_list, data.index);

            // 自動再生ボタンの状態更新
            if (data.auto_play !== undefined) {
                updateAutoplayButton(data.auto_play);
            }

        } catch (e) {
            console.error("Update error:", e);
        }
    }

    function updateAutoplayButton(isPlaying) {
        if (isPlaying) {
            btnAutoplay.innerText = "自動再生を停止";
            btnAutoplay.className = "btn-autoplay btn-stop";
        } else {
            btnAutoplay.innerText = "自動再生を開始";
            btnAutoplay.className = "btn-autoplay btn-play";
        }
    }

    async function toggleAutoplay() {
        try {
            const res = await fetch('/toggle_autoplay');
            const data = await res.json();
            updateAutoplayButton(data.auto_play);
        } catch (e) {
            console.error("Toggle autoplay error:", e);
        }
    }

    function renderShowcase(imageList, currentIdx) {
        showcase.innerHTML = '';
        imageList.forEach((path, idx) => {
            const img = document.createElement('img');
            img.src = '/' + path.replace(/\\/g, '/');
            img.className = 'thumbnail' + (idx === currentIdx ? ' active' : '');
            img.onclick = () => jumpToImage(idx);
            showcase.appendChild(img);
        });
    }

    async function jumpToImage(index) {
        try {
            await fetch(`/set_index?index=${index}`);
            sidebar.classList.remove('open');
            await updateStatus();
        } catch (e) {
            console.error("Jump error:", e);
        }
    }

    setInterval(updateStatus, 2000);
    updateStatus();
</script>
</body>
</html>
